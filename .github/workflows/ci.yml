name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      SANDBOX_MODE: off
      EMBEDDING_BACKEND: hash
      JWT_SECRET_KEY: ci_test_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Lint (non-blocking on first commit)
        run: python -m compileall -q backend scripts
      - name: Unit tests
        run: pytest -q --maxfail=1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t codepilot/api:ci .
      - name: Build sandbox image
        run: docker build -f docker/sandbox/Dockerfile -t codepilot/sandbox:ci docker/sandbox
